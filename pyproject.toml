[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "okf-mcp"
description = "MCP server for OKF vaults — 20 tools for AI agents to query, create, update, and analyze concepts"
# La versión NO se hardcodea acá: se lee dinámicamente de cli/__init__.py
# (__version__) — única fuente de verdad. Ver [tool.setuptools.dynamic].
# Bumpear solo cli/__init__.py; el paquete instalado reporta la misma versión
# (pip show / importlib.metadata). Si esto se rompe, tests/test_version.py falla.
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.0.0,<2", "pyyaml>=6.0"]
# PEP 639: la licencia va como expresión SPDX y el texto viaja como
# license-files. Necesita setuptools>=77; el classifier legado
# "License :: OSI Approved :: MIT License" ya no se permite junto a esto.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
readme = "README.md"
dynamic = ["version"]

[project.scripts]
okf-mcp = "server:mcp.run"

[tool.setuptools]
py-modules = ["server", "measure"]
packages = ["cli", "cli.commands"]

[tool.setuptools.dynamic]
version = { attr = "cli.__version__" }
